[colors]
bg-blue   = #0000AA
fg-white  = #FFFFFF
fg-cyan   = #55FFFF

[bar/templeos-top]
width = 100%
height = 15pt
radius = 0

background = ${colors.bg-blue}
foreground = ${colors.fg-white}

padding-left = 0
padding-right = 0
module-margin = 1

font-0 = "TempleOS:size=15;4"

modules-left = date-time fps memory cpu

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/date-time]
type = internal/date
interval = 1
date = "%a %m/%d %H:%M:%S"
label = "%date%"
label-foreground = ${colors.fg-white}

[module/fps]
type = custom/text
content = "FPS:30"
content-foreground = ${colors.fg-white}

[module/memory]
type = custom/script
exec = free -k | awk 'NR==2{printf "Mem:%08X\n", $3}'
interval = 1
label-foreground = ${colors.fg-white}

[module/cpu]
type = custom/script
exec = top -bn1 | grep "Cpu(s)" | sed "s/.*, *\([0-9.]*\)%* id.*/\1/" | awk '{print "CPU " sprintf("%02X", 100 - $1)}'
interval = 2
label-foreground = ${colors.fg-white}

[module/status-down]
type = custom/text
content = "DOWN"
content-foreground = ${colors.fg-white}

[settings]
screenchange-reload = true
pseudo-transparency = false
